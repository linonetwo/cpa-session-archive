<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>会话归档</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 0;
        background: #f5f6f8;
        color: #18202a;
      }
      .wrap {
        max-width: 1500px;
        margin: auto;
        padding: 20px;
      }
      h1 {
        margin: 0 0 16px;
      }
      .cards,
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .card,
      .panel {
        background: white;
        border: 1px solid #dde2e8;
        border-radius: 10px;
        padding: 14px;
      }
      .card {
        min-width: 150px;
      }
      .num {
        font-size: 24px;
        font-weight: 700;
      }
      .filters {
        margin: 14px 0;
      }
      .filters label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .filters select,
      .filters input,
      button {
        padding: 8px;
        border: 1px solid #ccd3dc;
        border-radius: 6px;
        background: white;
      }
      button {
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      th,
      td {
        padding: 9px;
        border-bottom: 1px solid #edf0f3;
        text-align: left;
      }
      tr:hover {
        background: #f1f7ff;
      }
      .muted {
        color: #667085;
      }
      .error {
        color: #b42318;
      }
      .drawer {
        position: fixed;
        inset: 0 0 0 32%;
        background: white;
        box-shadow: -4px 0 20px #0003;
        padding: 20px;
        overflow: auto;
        display: none;
      }
      .drawer.open {
        display: block;
      }
      .route-page {
        display: none;
        min-height: 100vh;
        background: #f5f6f8;
        padding: 24px;
        box-sizing: border-box;
      }
      .route-page.open {
        display: block;
      }
      .route-shell {
        max-width: 1500px;
        margin: auto;
      }
      .back-button {
        background: #1769e0;
        color: #fff;
        border-color: #1769e0;
        font-weight: 700;
        padding: 9px 14px;
      }
      .back-button:hover {
        background: #0f55bd;
      }
      .request-list-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        margin: 10px 0;
        cursor: pointer;
      }
      .request-list-item:hover {
        border-color: #7aa7e8;
        box-shadow: 0 2px 8px #1769e018;
      }
      .turn-card {
        display: grid;
        gap: 12px;
        margin: 12px 0;
        cursor: pointer;
      }
      .turn-card:hover {
        border-color: #7aa7e8;
        box-shadow: 0 2px 8px #1769e018;
      }
      .turn-primary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
      }
      .turn-primary > section {
        min-width: 0;
      }
      .turn-primary h3 {
        margin: 0 0 7px;
        font-size: 13px;
        color: #52606d;
      }
      .turn-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.55;
        max-height: 13em;
        overflow: hidden;
      }
      .turn-text-detail {
        max-height: none;
      }
      .turn-final {
        border-left: 4px solid #10b981;
        padding-left: 12px;
      }
      .process-step {
        border: 1px solid #d9e1ea;
        border-radius: 10px;
        background: #fff;
        margin: 10px 0;
        overflow: hidden;
      }
      .process-step > summary {
        cursor: pointer;
        padding: 11px 13px;
        font-weight: 650;
        background: #f8fafc;
      }
      .process-step-body {
        padding: 12px;
        display: grid;
        gap: 9px;
      }
      .tool-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #fde68a;
        background: #fffbeb;
        border-radius: 8px;
        padding: 9px 11px;
      }
      .tool-summary button {
        flex: none;
      }
      @media (max-width: 800px) {
        .turn-primary {
          grid-template-columns: 1fr;
        }
      }
      .loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #f8fafce8;
        place-items: center;
      }
      .loading-overlay.open {
        display: grid;
      }
      .loading-box {
        width: min(760px, calc(100vw - 40px));
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 4px solid #dce7f7;
        border-top-color: #1769e0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loading-sql {
        margin-top: 12px;
        max-height: 160px;
        background: #111827;
        color: #d1e4ff;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .full-content {
        margin-top: 8px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #111827;
        color: #e5e7eb;
        padding: 12px;
        border-radius: 8px;
        max-height: 45vh;
        overflow: auto;
      }
      .login {
        position: fixed;
        inset: 0;
        background: #fff;
        display: grid;
        place-items: center;
      }
      .login > div {
        width: 420px;
      }
      .facet-more {
        max-height: 220px;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px;
      }
      .filter-head,
      .filter-actions,
      .active-filters {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filter-head {
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .filter-head input {
        min-width: 280px;
      }
      .facet-groups {
        display: grid;
        gap: 10px;
      }
      .facet-group {
        border: 1px solid #e2e7ed;
        border-radius: 8px;
        padding: 8px;
      }
      .facet-group summary {
        cursor: pointer;
        font-weight: 650;
      }
      .facet-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 9px;
        margin-top: 9px;
      }
      .facet-grid label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .facet-grid select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccd3dc;
        border-radius: 6px;
        background: white;
      }
      .filter-head input,
      .filter-actions input {
        padding: 8px;
        border: 1px solid #ccd3dc;
        border-radius: 6px;
        background: white;
      }
      .filter-actions {
        margin-top: 12px;
      }
      .active-filters {
        margin: 8px 0;
      }
      .chip {
        background: #eaf2ff;
        color: #184b8a;
        border-radius: 999px;
        padding: 4px 9px;
      }
      .facet-meta {
        font-size: 12px;
        color: #667085;
      }
      .empty {
        padding: 28px;
        text-align: center;
        color: #667085;
      }
      .facet-badges {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .facet-badges span {
        background: #eef2f6;
        border-radius: 5px;
        padding: 3px 6px;
        font-size: 12px;
      }
      .app-layout {
        display: grid;
        grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        border-right: 1px solid #dde2e8;
        background: #fff;
        padding: 16px;
      }
      .sidebar > details {
        position: sticky;
        top: 16px;
        max-height: calc(100vh - 32px);
        overflow: auto;
      }
      .sidebar summary {
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        padding: 8px 2px 14px;
      }
      .content {
        min-width: 0;
        padding: 24px;
      }
      .content header h1 {
        margin-bottom: 4px;
      }
      .cards {
        margin: 18px 0;
      }
      .card {
        flex: 1;
        min-width: 170px;
      }
      .sessions-panel {
        padding: 0;
        overflow: hidden;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid #edf0f3;
      }
      .section-head h2 {
        margin: 0;
        font-size: 17px;
      }
      .table-wrap {
        overflow: auto;
      }
      tbody tr {
        cursor: pointer;
      }
      .conversation-title {
        font-weight: 650;
        max-width: 680px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conversation-meta {
        margin-top: 4px;
        font-size: 12px;
        color: #667085;
      }
      .key-pill,
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 3px 8px;
        background: #eef2f6;
        font-size: 12px;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .filter-head input {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }
      .facet-grid {
        grid-template-columns: 1fr;
      }
      .facet-group {
        background: #fafbfc;
      }
      .filter-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .filter-actions label {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .filter-actions input {
        width: 72px;
      }
      .drawer {
        position: static;
        inset: auto;
        box-shadow: none;
        overflow: visible;
      }
      .drawer-head {
        position: sticky;
        top: -20px;
        padding: 12px 0;
        background: white;
        z-index: 2;
        display: flex;
        gap: 8px;
      }
      .request-card {
        margin: 12px 0;
      }
      .request-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .request-preview {
        content-visibility: auto;
        contain-intrinsic-size: 600px;
      }
      .conversation-stream {
        display: grid;
        gap: 10px;
        margin: 12px 0;
      }
      .message-bubble {
        border: 1px solid #e1e7ee;
        border-radius: 10px;
        padding: 10px 12px;
        background: #f8fafc;
      }
      .message-bubble.user {
        border-left: 4px solid #3b82f6;
        background: #eff6ff;
      }
      .message-bubble.assistant {
        border-left: 4px solid #10b981;
        background: #ecfdf5;
      }
      .message-bubble.tool {
        border-left: 4px solid #f59e0b;
        background: #fffbeb;
      }
      .message-bubble.compaction {
        border-left: 4px solid #8b5cf6;
        background: #f5f3ff;
      }
      .message-role {
        font-size: 12px;
        font-weight: 700;
        color: #475467;
        margin-bottom: 6px;
      }
      .message-text {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
      }
      .context-summary {
        color: #667085;
        background: #f2f4f7;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 8px 0;
      }
      .technical-meta {
        margin: 8px 0;
      }
      .technical-meta dl {
        display: grid;
        grid-template-columns: minmax(130px, 220px) 1fr;
        gap: 5px 12px;
      }
      .technical-meta dt {
        color: #667085;
      }
      .technical-meta dd {
        margin: 0;
        word-break: break-word;
      }
      .raw-diagnostics {
        margin-top: 8px;
      }
      .request-snippet {
        margin-top: 8px;
        color: #344054;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .response-snippet {
        margin-top: 6px;
        color: #08745b;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
      }
      .pagination button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .pagination input {
        width: 72px;
        text-align: center;
      }
      .kind-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 700;
        background: #eef2ff;
        color: #4338ca;
        margin-right: 8px;
      }
      .kind-badge.compaction {
        background: #f3e8ff;
        color: #7e22ce;
      }
      .kind-badge.retry {
        background: #fff7ed;
        color: #c2410c;
      }
      .kind-badge.history_snapshot,
      .kind-badge.context_rebuild {
        background: #ecfeff;
        color: #0e7490;
      }
      .download-notice {
        display: none;
        margin: 12px 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
      }
      .download-notice.open {
        display: block;
      }
      .download-notice a {
        font-weight: 700;
        word-break: break-all;
      }
      .system-context {
        margin: 10px 0;
        border: 1px solid #d0d5dd;
        border-radius: 10px;
        padding: 10px 12px;
        background: #f8fafc;
      }
      .system-context summary {
        cursor: pointer;
        font-weight: 700;
      }
      .system-context pre {
        max-height: 65vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .export-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .export-controls select {
        padding: 8px;
        border: 1px solid #ccd3dc;
        border-radius: 6px;
        background: #fff;
      }
      .diagnostic-grid,
      .tool-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 10px;
        margin: 12px 0;
      }
      .diagnostic-card,
      .tool-card {
        border: 1px solid #d9e1ea;
        border-radius: 10px;
        padding: 12px;
        background: #fff;
      }
      .diagnostic-card h3,
      .tool-card h3 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      .diagnostic-card p,
      .tool-card p {
        margin: 5px 0;
      }
      .diagnostic-card button,
      .tool-card button {
        margin-top: 8px;
        color: #1769e0;
        border-color: #9fc0ed;
      }
      .diagnostic-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .diagnostic-content {
        max-height: calc(100vh - 260px);
        min-height: 320px;
      }
      .status-success {
        color: #08745b;
      }
      .status-error {
        color: #b42318;
      }
      .login input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
      }
      @media (max-width: 900px) {
        .app-layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid #dde2e8;
        }
        .sidebar > details {
          position: static;
          max-height: none;
        }
        .drawer {
          inset: 0;
        }
        .content {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="listView" class="app-layout">
      <aside class="sidebar">
        <details id="filterSidebar" open>
          <summary>
            <span data-i18n="facetedFilter"></span
            ><span id="activeCount" class="badge">0</span>
          </summary>
          <div class="filter-head">
            <input
              id="facetSearch"
              data-i18n-placeholder="facetSearchPlaceholder"
              oninput="filterFacetNames()"
            />
          </div>
          <div id="activeFilters" class="active-filters"></div>
          <div id="filters" class="facet-groups"></div>
          <div class="filter-actions">
            <label
              ><span data-i18n="limit"></span
              ><input id="limit" type="number" value="100" min="1" max="1000"
            /></label>
            <button data-i18n="apply" onclick="loadSessions()"></button>
            <button data-i18n="reset" onclick="resetFilters()"></button>
          </div>
        </details>
      </aside>
      <main class="content">
        <header>
          <h1 data-i18n="title">会话归档</h1>
          <p class="muted" data-i18n="subtitle"></p>
        </header>
        <div id="cards" class="cards"></div>
        <section class="panel sessions-panel">
          <div class="section-head">
            <h2 data-i18n="sessionsTitle"></h2>
            <div class="export-controls">
              <span id="resultCount" class="muted"></span
              ><select id="allExportFormat">
                <option value="archive" data-i18n="archiveFormat"></option>
                <option value="sft" data-i18n="sftFormat"></option></select
              ><button
                data-i18n="exportAll"
                onclick="downloadExport('all')"
              ></button>
            </div>
          </div>
          <div id="allDownloadNotice" class="download-notice"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="columnConversation"></th>
                  <th data-i18n="columnKey"></th>
                  <th data-i18n="columnModel"></th>
                  <th data-i18n="columnRequests"></th>
                  <th data-i18n="columnLastActivity"></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="drawer" class="drawer route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToSessions"
            onclick="goSessions()"
          ></button>
          <div class="export-controls">
            <select id="sessionOrder" onchange="loadSessionPage(1)">
              <option value="desc" data-i18n="newestFirst"></option>
              <option value="asc" data-i18n="oldestFirst"></option></select
            ><select id="sessionExportFormat">
              <option value="archive" data-i18n="archiveFormat"></option>
              <option value="sft" data-i18n="sftFormat"></option></select
            ><button id="download" data-i18n="exportSession"></button>
          </div>
        </div>
        <h2 id="detailTitle"></h2>
        <p id="detailMeta" class="muted"></p>
        <div id="downloadNotice" class="download-notice"></div>
        <div id="detail"></div>
        <nav id="pagination" class="pagination">
          <button
            id="pageFirst"
            data-i18n="firstPage"
            onclick="goSessionPage(1)"
          ></button
          ><button
            id="pagePrevious"
            data-i18n="previousPage"
            onclick="changeSessionPage(-1)"
          ></button
          ><strong id="pageInfo"></strong
          ><label
            ><span data-i18n="jumpToPage"></span>
            <input
              id="pageJump"
              type="number"
              min="1"
              onchange="goSessionPage(this.value)"
              onkeydown="if(event.key==='Enter') goSessionPage(this.value)" /></label
          ><button
            id="pageNext"
            data-i18n="nextPage"
            onclick="changeSessionPage(1)"
          ></button
          ><button
            id="pageLast"
            data-i18n="lastPage"
            onclick="goLastSessionPage()"
          ></button>
        </nav>
      </div>
    </div>
    <div id="turnView" class="route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToSession"
            onclick="goSession()"
          ></button>
        </div>
        <h2 id="turnTitle"></h2>
        <p id="turnMeta" class="muted"></p>
        <div id="turnPrimary" class="panel turn-primary"></div>
        <h3 data-i18n="turnProcess"></h3>
        <p class="muted" data-i18n="turnProcessHint"></p>
        <div id="turnProcess"></div>
        <nav id="turnPagination" class="pagination">
          <button
            data-i18n="previousPage"
            onclick="changeTurnPage(-1)"
          ></button>
          <strong id="turnPageInfo"></strong>
          <button data-i18n="nextPage" onclick="changeTurnPage(1)"></button>
        </nav>
      </div>
    </div>
    <div id="requestView" class="route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToTurn"
            onclick="goParentFromRequest()"
          ></button>
        </div>
        <h2 id="requestTitle"></h2>
        <p id="requestMeta" class="muted"></p>
        <div id="requestDetail"></div>
      </div>
    </div>
    <div id="subDetailView" class="route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToRequest"
            onclick="goRequest()"
          ></button>
        </div>
        <h2 id="subDetailTitle"></h2>
        <p id="subDetailMeta" class="muted"></p>
        <div id="subDetail"></div>
      </div>
    </div>
    <div id="loading" class="loading-overlay" aria-live="polite">
      <div class="panel loading-box">
        <div class="spinner"></div>
        <h3 id="loadingStage"></h3>
        <div class="muted" data-i18n="executingQuery"></div>
        <pre id="loadingSQL" class="loading-sql"></pre>
      </div>
    </div>
    <div id="login" class="login">
      <div class="panel">
        <h2 data-i18n="connectTitle"></h2>
        <label
          ><span data-i18n="apiBase"></span><input id="base" value="" /></label
        ><br />
        <label

          path[7]
        ) {
          currentTurnID = path[3];
          await showRawDetail(path[1], path[5], path[7]);
          return;
        }
        if (
          path[1] &&
          path[2] === "turns" &&
          path[3] &&
          path[4] === "requests" &&
          path[5] &&
          path[6] === "tools" &&
          path[7] != null
        ) {
          currentTurnID = path[3];
          await showToolDetail(path[1], path[5], path[7]);
          return;
        }
        if (
          path[1] &&
          path[2] === "turns" &&
          path[3] &&
          path[4] === "requests" &&
          path[5]
        ) {
          await showRequest(path[1], path[5], path[3]);
          return;
        }
        if (path[1] && path[2] === "turns" && path[3]) {
          await showTurn(path[1], path[3]);
          return;
        }
        if (
          path[1] &&
          path[2] === "requests" &&
          path[3] &&
          path[4] === "raw" &&
          path[5]
        ) {
          currentTurnID = "";
          await showRawDetail(path[1], path[3], path[5]);
          return;
        }
        if (
          path[1] &&
          path[2] === "requests" &&
          path[3] &&
          path[4] === "tools" &&
          path[5] != null
        ) {
          currentTurnID = "";
          await showToolDetail(path[1], path[3], path[5]);
          return;
        }
        if (path[1] && path[2] === "requests" && path[3]) {
          currentTurnID = "";
          await showRequest(path[1], path[3]);
          return;
        }
        if (path[1]) {
          await showSession(path[1]);
          return;
        }
        document.getElementById("drawer").classList.remove("open");
        document.getElementById("requestView").classList.remove("open");
        document.getElementById("turnView").classList.remove("open");
        document.getElementById("subDetailView").classList.remove("open");
        currentTurnID = "";
        document.getElementById("listView").style.display = "grid";
      }
      function esc(x) {
        return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      applyI18n();
      var languageRoot = document.documentElement;
      try {
        if (parent !== window && parent.document.documentElement)
          languageRoot = parent.document.documentElement;
      } catch (ignore) {}
      new MutationObserver(function (mutations) {
        if (
          mutations.some(function (mutation) {
            return mutation.attributeName === "lang";
          })
        ) {
          applyI18n();
          if (
            session &&
            document.getElementById("login").style.display === "none"
          )
            loadSessions();
        }
      }).observe(languageRoot, {
        attributes: true,
        attributeFilter: ["lang"],
      });

      var a = panelAuth();
      if (a) {
        session = a;
        document.getElementById("base").value = a.base;
        start();
      } else {
        document.getElementById("base").value = location.origin;
      }
      window.addEventListener("hashchange", function () {
        route().catch(function (e) {
          console.error(e);
          hideLoading();
        });
      });
    </script>
  </body>
</html>
