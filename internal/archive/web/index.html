<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Archive</title><style>body{font:14px system-ui;margin:0;background:#f5f6f8;color:#18202a}.wrap{max-width:1500px;margin:auto;padding:20px}h1{margin:0 0 16px}.cards,.filters{display:flex;gap:10px;flex-wrap:wrap}.card,.panel{background:white;border:1px solid #dde2e8;border-radius:10px;padding:14px}.card{min-width:150px}.num{font-size:24px;font-weight:700}.filters{margin:14px 0}.filters label{display:flex;flex-direction:column;gap:4px}.filters select,.filters input,button{padding:8px;border:1px solid #ccd3dc;border-radius:6px;background:white}button{cursor:pointer}table{width:100%;border-collapse:collapse;background:white}th,td{padding:9px;border-bottom:1px solid #edf0f3;text-align:left}tr:hover{background:#f1f7ff}.muted{color:#667085}.drawer{position:fixed;inset:0 0 0 32%;background:white;box-shadow:-4px 0 20px #0003;padding:20px;overflow:auto;display:none}.drawer.open{display:block}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;max-height:45vh;overflow:auto}.login{position:fixed;inset:0;background:#fff;display:grid;place-items:center}.login>div{width:420px}.facet-more{max-height:220px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}</style></head><body><div class="wrap"><h1>Session Archive</h1><div id="cards" class="cards"></div><div class="panel filters" id="filters"></div><div class="panel"><table><thead><tr><th>项目</th><th>Session</th><th>请求</th><th>模型</th><th>Key</th><th>最后活动</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="drawer" class="drawer"><button onclick="closeDrawer()">关闭</button> <button id="download">导出 JSON</button><h2 id="detailTitle"></h2><div id="detail"></div></div><div id="login" class="login"><div class="panel"><h2>连接 CPA 管理 API</h2><label>API Base<input id="base" style="width:100%" value=""></label><br><label>Management Key<input id="key" type="password" style="width:100%"></label><br><button onclick="manualLogin()">登录</button><p class="muted">若 CPAMP 已记住管理密码，本页会自动复用；否则仅在本页内存中使用，不写入存储。</p></div></div><script>
var session=null,facets=[],lastDetail=null;var core=['project.name','project.path','git.remote','client','originator','model.requested','model.resolved','key.id','outcome','source.format','request.kind','stream','status.code'];
function xor(data,key){var o=new Uint8Array(data.length);for(var i=0;i<data.length;i++)o[i]=data[i]^key[i%key.length];return o}function panelAuth(){try{var raw=localStorage.getItem('cli-proxy-auth');if(!raw)return null;if(raw.indexOf('enc::v1::')===0){var bin=atob(raw.slice(9)),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);var kb=new TextEncoder().encode('cli-proxy-api-webui::secure-storage|'+location.host+'|'+navigator.userAgent);raw=new TextDecoder().decode(xor(b,kb))}var x=JSON.parse(raw),s=x.state||x;if(s.apiBase&&s.managementKey)return{base:s.apiBase.replace(/\/$/,''),key:s.managementKey}}catch(e){}return null}
function manualLogin(){session={base:document.getElementById('base').value.replace(/\/$/,''),key:document.getElementById('key').value};start()}
async function api(path){var r=await fetch(session.base+'/v0/management/plugins/cpa-session-archive'+path,{headers:{Authorization:'Bearer '+session.key}});if(!r.ok)throw Error(r.status);return r.json()}
function fmt(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KiB';if(n<1073741824)return(n/1048576).toFixed(1)+' MiB';return(n/1073741824).toFixed(1)+' GiB'}
async function start(){try{var st=await api('/stats');document.getElementById('login').style.display='none';document.getElementById('cards').innerHTML=[['记录',st.records],['Session',st.sessions],['CAS Blob',st.blobs],['逻辑内容',fmt(st.logical_bytes)],['实际压缩',fmt(st.compressed_bytes)],['累计节省',fmt(st.saved_bytes)]].map(function(x){return'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>'}).join('');facets=await api('/facets');renderFilters();await loadSessions()}catch(e){document.getElementById('login').style.display='grid'}}
function renderFilters(){var grouped={};facets.forEach(function(f){(grouped[f.name]||(grouped[f.name]=[])).push(f)});var names=Object.keys(grouped).sort(function(a,b){return core.indexOf(a)-core.indexOf(b)});var h=names.map(function(n){var opts=grouped[n].slice(0,100).map(function(x){return'<option value="'+esc(x.value)+'">'+esc(x.value)+' ('+x.sessions+')</option>'}).join('');return'<label>'+esc(n)+'<select data-facet="'+esc(n)+'"><option value="">全部</option>'+opts+'</select></label>'}).join('');document.getElementById('filters').innerHTML=h+'<label>数量<input id="limit" type="number" value="100" min="1" max="1000"></label><button onclick="loadSessions()">筛选</button><button onclick="resetFilters()">重置</button>'}
async function loadSessions(){var q=new URLSearchParams();document.querySelectorAll('[data-facet]').forEach(function(x){if(x.value)q.set(x.dataset.facet,x.value)});q.set('limit',document.getElementById('limit').value||100);var rows=await api('/sessions?'+q);document.getElementById('rows').innerHTML=rows.map(function(x){return'<tr onclick="openSession(\''+esc(x.session_id)+'\')"><td>'+esc(x.project||'—')+'</td><td>'+esc(x.session_id)+'</td><td>'+x.requests+'</td><td>'+esc(x.model||'—')+'</td><td>'+esc(x.key_id||'—')+'</td><td>'+esc(x.last_at)+'</td></tr>'}).join('')}
function resetFilters(){document.querySelectorAll('[data-facet]').forEach(function(x){x.value=''});loadSessions()}
async function openSession(id){var data=await api('/sessions?id='+encodeURIComponent(id));lastDetail=data;document.getElementById('detailTitle').textContent=id;document.getElementById('detail').innerHTML=data.map(function(r,i){var req=decode64(r.original_request),resp=decode64(r.response);return'<div class="panel"><b>#'+(i+1)+' '+esc(r.requested_model||r.model)+' '+esc(r.outcome)+' '+r.status_code+'</b><p class="muted">'+esc(JSON.stringify(r.facets||{}))+'</p><details><summary>Request ('+req.length+')</summary><pre>'+esc(req.slice(0,20000))+'</pre></details><details><summary>Response ('+resp.length+')</summary><pre>'+esc(resp.slice(0,20000))+'</pre></details></div>'}).join('');document.getElementById('drawer').classList.add('open');document.getElementById('download').onclick=function(){var b=new Blob([JSON.stringify(lastDetail,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=id+'.json';a.click();URL.revokeObjectURL(a.href)}}
function decode64(x){if(!x)return'';try{return new TextDecoder().decode(Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)}))}catch(e){return'[binary '+x.length+' base64 chars]'}}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var a=panelAuth();if(a){session=a;document.getElementById('base').value=a.base;start()}else{document.getElementById('base').value=location.origin}
</script></body></html>
